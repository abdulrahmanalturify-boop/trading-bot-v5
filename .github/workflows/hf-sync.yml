# Copies the site to a Hugging Face Space after every push to main (the Streamlit site keeps running as before).
# Needs the repository secret HF_TOKEN (a Hugging Face token with the "Write" role); without it this does nothing.
# The site's secrets (SUPABASE_URL, SUPABASE_KEY, BOTS_PASSWORD, FRED_API_KEY) are copied to the Space when set here.
name: sync to hugging face
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: hf-sync
  cancel-in-progress: true
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install "huggingface_hub>=0.30"
      - run: python scripts/hf_sync.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          BOTS_PASSWORD: ${{ secrets.BOTS_PASSWORD }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
