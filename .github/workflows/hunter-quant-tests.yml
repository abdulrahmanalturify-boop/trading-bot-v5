name: Opportunity Hunter quantitative checks

on:
  pull_request:
    paths:
      - "hunter.py"
      - "hunter_quant.py"
      - "p_scanner.py"
      - "tests/test_hunter_quant.py"
      - ".github/workflows/hunter-quant-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quant-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas
      - name: Syntax check
        run: python -m py_compile hunter_quant.py hunter.py p_scanner.py
      - name: Quantitative guardrails
        run: python -m unittest discover -s tests -p 'test_hunter_quant.py' -v
