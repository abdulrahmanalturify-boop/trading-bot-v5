# By hand (or a push of scripts/saudi_probe2.py on "research"): what Yahoo Finance has for the Saudi calendars, funds and long
# history (scripts/saudi_probe2.py). Commits research/results/saudi_probe2.txt and saudi_probe2.json to "research".
name: saudi probe 2
on:
  push:
    branches: [research]
    paths: ["scripts/saudi_probe2.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: saudi-probe2
  cancel-in-progress: true
jobs:
  list:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: research
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/saudi_probe2.py 2>&1 | tee probe2_log.txt
      - if: always()
        run: |
          git config user.name "research-lab"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/sa && cp probe2_log.txt /tmp/sa/ && cp research/results/saudi_probe2.* /tmp/sa/ 2>/dev/null || true
          git fetch -q origin research
          git checkout -q -B upd origin/research
          mkdir -p research/results && cp /tmp/sa/* research/results/ 2>/dev/null || true
          git add research/results/saudi_probe2* || true
          git commit -q -m "saudi probe 2 [skip ci]" || exit 0
          git push -q origin upd:research
