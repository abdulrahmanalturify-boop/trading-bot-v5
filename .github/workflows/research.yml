# The bots' lab on real prices (branch "research" only; the site on "main" is not touched).
# A push to research/ (or a manual run) runs research/run.py and commits the reports in research/results.
name: research
on:
  push:
    branches: [research]
    paths: ["research/run.py", "research/config.json"]          # a new engine is tested by a manual run (Actions > research)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: research
  cancel-in-progress: true
jobs:
  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - id: day
        run: echo "d=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: research/.cache
          key: prices-${{ steps.day.outputs.d }}
          restore-keys: prices-
      - run: python research/run.py
      - run: python research/compact.py
      - name: Save the reports
        run: |
          git config user.name "research-lab"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results lab_results.json
          git commit -m "lab results [skip ci]" || exit 0
          git pull --rebase -q origin research
          git push -q origin HEAD:research
