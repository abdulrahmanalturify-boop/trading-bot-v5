# The Saudi market's Sharia lists (scripts/build_sharia.py -> sharia_lists.json): Al Rajhi Capital's and Albilad Capital's
# lists of permitted shares as Argaam puts them side by side, and the Almaqased Center's yearly study with the purification
# amount per share. Weekly, on a push of the reader, or by hand. Commits sharia_lists.json to "research" and moves "main" and
# "redesign" to the same commit when they were at research's previous one. The sources themselves are not kept in the repository.
name: sharia lists
on:
  push:
    branches: [research]
    paths: ["scripts/build_sharia.py", ".github/workflows/sharia.yml"]
  schedule:
    - cron: "17 5 * * 0"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sharia
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: research
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: sudo apt-get install -y -q poppler-utils > /dev/null
      - run: pip install requests beautifulsoup4 lxml
      - name: Read the lists
        run: |
          set -o pipefail
          python scripts/build_sharia.py 2>&1 | tee sharia_log.txt
      - name: Save
        if: always()
        run: |
          git config user.name "research-lab"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp sharia_log.txt /tmp/sharia_log.txt 2>/dev/null || true
          [ -f sharia_lists.json ] && cp sharia_lists.json /tmp/sharia_lists.json
          rm -rf research/sharia_raw
          git fetch -q origin research main redesign
          git checkout -q -f -B upd origin/research
          old=$(git rev-parse HEAD)
          mkdir -p research/results
          [ -f /tmp/sharia_log.txt ] && cp /tmp/sharia_log.txt research/results/sharia_log.txt && git add research/results/sharia_log.txt
          [ -f /tmp/sharia_lists.json ] && cp /tmp/sharia_lists.json sharia_lists.json && git add sharia_lists.json
          git commit -q -m "Sharia lists [skip ci]" || exit 0
          git push -q origin upd:research
          for b in main redesign; do
            if [ "$(git rev-parse origin/$b)" = "$old" ]; then git push -q origin upd:$b; else echo "$b is not at research's commit: left as it is"; fi
          done
