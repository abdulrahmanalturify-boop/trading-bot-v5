name: Hunter V3 isolated research checks

on:
  pull_request:
    paths:
      - "hunter_v3.py"
      - "p_hunter_v3.py"
      - "app.py"
      - "tests/test_hunter_v3.py"
      - ".github/workflows/hunter-v3-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hunter-v3-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas
      - name: Compile all changed Python modules
        run: python -m py_compile hunter_v3.py p_hunter_v3.py app.py
      - name: Safety and no-lookahead unit tests
        run: python -m unittest discover -s tests -p 'test_hunter_v3.py' -v
