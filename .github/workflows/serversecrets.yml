# By hand: the site's secrets (the GitHub secret STREAMLIT_SECRETS, the same text as Streamlit's Secrets) written onto its own
# server (Oracle Cloud) over SSH (the GitHub secret ORACLE_SSH_KEY, the key downloaded when the server was made), then the site
# restarted. Nothing secret is printed: only whether each step worked.
name: server secrets
on:
  workflow_dispatch:
    inputs:
      host:
        description: "the server's IP"
        default: "84.13.143.157"
permissions:
  contents: read
concurrency:
  group: server-secrets
  cancel-in-progress: false
jobs:
  push:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: write the secrets on the server and restart the site
        env:
          KEY: ${{ secrets.ORACLE_SSH_KEY }}
          SECRETS: ${{ secrets.STREAMLIT_SECRETS }}
          HOST: ${{ github.event.inputs.host }}
        run: |
          set -euo pipefail
          [ -n "$KEY" ] || { echo "ORACLE_SSH_KEY is missing in the repository's Actions secrets"; exit 1; }
          [ -n "$SECRETS" ] || { echo "STREAMLIT_SECRETS is missing in the repository's Actions secrets"; exit 1; }
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/oracle
          chmod 600 ~/.ssh/oracle
          SSH="ssh -i $HOME/.ssh/oracle -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 ubuntu@$HOST"
          $SSH 'echo "connected to $(hostname)"'
          printf '%s\n' "$SECRETS" | tr -d '\r' | $SSH 'sudo tee /home/tura/.streamlit/secrets.toml > /dev/null && sudo chown tura:tura /home/tura/.streamlit/secrets.toml && sudo chmod 600 /home/tura/.streamlit/secrets.toml && sudo systemctl restart tura && echo "secrets written ($(sudo wc -l < /home/tura/.streamlit/secrets.toml) lines), site restarted"'
          sleep 20
          $SSH 'systemctl is-active tura caddy tura-update.timer; curl -s -o /dev/null -w "health: %{http_code}\n" http://127.0.0.1:8501/_stcore/health; sudo journalctl -u tura --no-pager -n 15 | grep -iv "secret\|key\|token\|password" || true'
          rm -f ~/.ssh/oracle
