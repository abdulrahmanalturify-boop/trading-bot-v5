# The five smart bots (smartbots.py, brain.py) tested on real prices, period by period (branch "research" only; the site on
# "main" is not touched). A push of the test, the bots or the brain (or a manual run) runs research/smart.py and commits
# smart_results.json, the report research/results/smart.md and the run's log research/results/smart_log.txt.
name: smart bots
on:
  push:
    branches: [research]
    paths: ["research/smart.py", "smartbots.py", "brain.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: smart-bots
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - id: day
        run: echo "d=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: research/.cache
          key: smart-prices-${{ steps.day.outputs.d }}
          restore-keys: smart-prices-
      - name: Test the bots
        run: |
          set -o pipefail
          mkdir -p research/results
          python research/smart.py 2>&1 | tee research/results/smart_log.txt
      - name: Save the results
        if: always()
        run: |
          git config user.name "research-lab"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/smart_log.txt
          for f in research/results/smart.md smart_results.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          git commit -m "smart bots results [skip ci]" || exit 0
          git pull --rebase -q origin research
          git push -q origin HEAD:research
